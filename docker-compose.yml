# Local Redpanda (Kafka-compatible broker) + Redpanda Console.
# Single node, dev mode — enough to learn Kafka semantics locally.
#
#   docker compose up -d        start broker + console
#   docker compose down         stop (keeps data volume)
#   docker compose down -v      stop and wipe the log (fresh start)
#
# External Kafka listener is localhost:19092 (matches KAFKA_BROKERS in .env.example).
# Console UI: http://localhost:8080
services:
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    container_name: wsl-redpanda
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --default-log-level=info
      # Two listeners: "internal" for in-network clients (console), "external"
      # for tools on the host (our Go commands at localhost:19092).
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
    ports:
      - "19092:19092" # Kafka API (host)
      - "9644:9644"   # Admin API / metrics
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 12

  console:
    image: redpandadata/console:v2.7.2
    container_name: wsl-console
    depends_on:
      redpanda:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: redpanda:9092

  # Real-time OLAP (PR 9): ingests the validated topic from Redpanda via the
  # Kafka table engine; Grafana queries it for live insight.
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: wsl-clickhouse
    depends_on:
      redpanda:
        condition: service_healthy
    ports:
      - "8123:8123" # HTTP
      - "9000:9000" # native (Grafana datasource)
    environment:
      # Local lab: keep the classic open "default" user (network access, no
      # password) instead of the image's lock-down-when-no-password behavior.
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - ./deploy/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./deploy/clickhouse/config.d/kafka.xml:/etc/clickhouse-server/config.d/kafka.xml:ro
      - clickhouse-data:/var/lib/clickhouse

  grafana:
    image: grafana/grafana:11.2.0
    container_name: wsl-grafana
    depends_on:
      - clickhouse
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_INSTALL_PLUGINS: "grafana-clickhouse-datasource"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro

  # S3-compatible object store for the raw backup + Parquet lake.
  # S3 API on host :9100 (container 9000; 9000 is taken by clickhouse).
  # Console UI: http://localhost:9101  (login rustfsadmin / rustfsadmin)
  rustfs:
    image: rustfs/rustfs:latest
    container_name: wsl-rustfs
    ports:
      - "9100:9000" # S3 API (host)
      - "9101:9001" # console
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
    volumes:
      - rustfs-data:/data
    restart: unless-stopped

  # Raw backup consumer: validated topic -> verbatim gzipped JSONL in RustFS.
  archiver:
    build: .
    image: wiki-stream-lab:local
    container_name: wsl-archiver
    depends_on:
      topics-init:
        condition: service_completed_successfully
      rustfs:
        condition: service_started
    environment:
      KAFKA_BROKERS: redpanda:9092
      S3_ENDPOINT: http://rustfs:9000
      S3_ACCESS_KEY: rustfsadmin
      S3_SECRET_KEY: rustfsadmin
      S3_BUCKET: wiki-stream-lab
    command: ["/app/archiver"]
    restart: unless-stopped

  # --- pipeline apps (Go), all from one image (Dockerfile) ---

  # One-shot: create the topics, then exit. The apps wait for it to finish.
  topics-init:
    build: .
    image: wiki-stream-lab:local
    container_name: wsl-topics-init
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: redpanda:9092
    command: ["/app/cli", "topics", "create"]
    restart: "no"

  producer:
    build: .
    image: wiki-stream-lab:local
    container_name: wsl-producer
    depends_on:
      topics-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BROKERS: redpanda:9092
      PRODUCER_MAX_SECONDS: "0" # run forever
    command: ["/app/producer"]
    restart: unless-stopped

  validator:
    build: .
    image: wiki-stream-lab:local
    container_name: wsl-validator
    depends_on:
      topics-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BROKERS: redpanda:9092
    command: ["/app/validator"]
    restart: unless-stopped

  # Scale for the lag demo:  docker compose up -d --scale projector=3
  projector:
    build: .
    image: wiki-stream-lab:local
    depends_on:
      topics-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BROKERS: redpanda:9092
      SQLITE_PATH: /data/wiki-stream-lab.sqlite
      SLOW_CONSUMER_MS: "0" # set >0 to induce lag
    command: ["/app/projector"]
    volumes:
      - sqlite-data:/data
    restart: unless-stopped

volumes:
  redpanda-data: {}
  clickhouse-data: {}
  sqlite-data: {}
  rustfs-data: {}
