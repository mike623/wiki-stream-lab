apiVersion: apps/v1
kind: Deployment
metadata:
  name: validator
spec:
  replicas: 1               # scalable consumer group; 1 is fine by default
  selector: { matchLabels: { app: validator } }
  template:
    metadata:
      labels: { app: validator }
    spec:
      # Topics aren't auto-created (see redpanda.yaml). Ensure they exist at the
      # right partition count before the consumer's Reader starts — kafka-go
      # Readers don't recover if their topic is absent at startup.
      initContainers:
        - name: wait-topics
          image: {{ include "wsl.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/app/cli","topics","create"]
          env:
            - { name: KAFKA_BROKERS, value: "{{ .Values.kafka.brokers }}" }
      containers:
        - name: validator
          image: {{ include "wsl.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/app/validator"]
          env:
            - { name: KAFKA_BROKERS, value: "{{ .Values.kafka.brokers }}" }
