apiVersion: v1
kind: Service
metadata:
  name: console
  labels: { app: console }
spec:
  selector: { app: console }
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: console
spec:
  replicas: 1
  selector: { matchLabels: { app: console } }
  template:
    metadata:
      labels: { app: console }
    spec:
      containers:
        - name: console
          image: redpandadata/console:v2.7.2
          env:
            - { name: KAFKA_BROKERS, value: "{{ .Values.kafka.brokers }}" }
          ports:
            - { containerPort: 8080, name: http }
