apiVersion: apps/v1
kind: Deployment
metadata:
  name: laker
spec:
  replicas: 1               # SCALE TARGET for the demo (group lake-parquet)
  selector: { matchLabels: { app: laker } }
  template:
    metadata:
      labels: { app: laker }
    spec:
      # Topics aren't auto-created (see redpanda.yaml). Ensure they exist at the
      # right partition count before the consumer's Reader starts — kafka-go
      # Readers don't recover if their topic is absent at startup.
      initContainers:
        - name: wait-topics
          image: {{ include "wsl.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/app/cli","topics","create"]
          env:
            - { name: KAFKA_BROKERS, value: "{{ .Values.kafka.brokers }}" }
      containers:
        - name: laker
          image: {{ include "wsl.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/app/laker"]
          env:
            - { name: KAFKA_BROKERS, value: "{{ .Values.kafka.brokers }}" }
            - { name: S3_ENDPOINT, value: "{{ .Values.s3.endpoint }}" }
            - { name: S3_BUCKET, value: "{{ .Values.s3.bucket }}" }
            - name: S3_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: s3-creds, key: accessKey } }
            - name: S3_SECRET_KEY
              valueFrom: { secretKeyRef: { name: s3-creds, key: secretKey } }
