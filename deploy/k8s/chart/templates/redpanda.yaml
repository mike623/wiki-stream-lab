apiVersion: v1
kind: Service
metadata:
  name: redpanda
  labels: { app: redpanda }
spec:
  clusterIP: None          # headless: stable pod DNS redpanda-0.redpanda
  selector: { app: redpanda }
  ports:
    - { name: kafka, port: 9092, targetPort: 9092 }
    - { name: admin, port: 9644, targetPort: 9644 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redpanda
spec:
  serviceName: redpanda
  replicas: 1
  selector: { matchLabels: { app: redpanda } }
  template:
    metadata:
      labels: { app: redpanda }
    spec:
      containers:
        - name: redpanda
          image: redpandadata/redpanda:v24.2.7
          args:
            - redpanda
            - start
            - --mode=dev-container
            - --smp=1
            - --default-log-level=info
            # k8s has no Compose depends_on ordering: producer would auto-create
            # the topics at 1 partition before the topics-init hook makes them
            # at 6. Disable auto-create so topics-init is the sole creator.
            - --set redpanda.auto_create_topics_enabled=false
            - --kafka-addr=internal://0.0.0.0:9092
            - --advertise-kafka-addr=internal://redpanda:9092
            - --rpc-addr=0.0.0.0:33145
            - --advertise-rpc-addr=redpanda:33145
          ports:
            - { containerPort: 9092, name: kafka }
            - { containerPort: 9644, name: admin }
          readinessProbe:
            exec:
              command: ["sh","-c","rpk cluster health | grep -q 'Healthy:.*true'"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          volumeMounts:
            - { name: data, mountPath: /var/lib/redpanda/data }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- include "wsl.storageClass" . | nindent 8 }}
        resources: { requests: { storage: {{ .Values.storage.redpanda }} } }
